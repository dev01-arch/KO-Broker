name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production Build
        run: pnpm --filter @ko/web build
        env:
          SKIP_ENV_VALIDATION: "1"

  migrate:
    name: Supabase Database Migrations
    needs: validate
    runs-on: ubuntu-latest
    if: inputs.skip_migrations != true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Migrations on Supabase
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  deploy:
    name: Deploy Application
    needs: [validate, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Post-Deploy Health Check & Cron Verification
        run: |
          PROD_URL="${{ steps.vercel_deploy.outputs.url || secrets.PRODUCTION_APP_URL }}"
          echo "Checking application health at: $PROD_URL"
          
          # Health endpoint check
          curl --fail --retry 3 --retry-delay 5 "$PROD_URL/api/health" || true

          # Test Cron endpoints using CRON_SECRET (PRD-16: all four jobs)
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            echo "Verifying Message Email Digests Cron..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "$PROD_URL/api/cron/message-email-digests" | grep -q "ok" && echo "Digests cron verified" || echo "Warning: check digests cron log"

            echo "Verifying Bank of England Rate Ingest Cron..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "$PROD_URL/api/cron/intelligence-rates" | grep -q "ok" && echo "Rates cron verified" || echo "Warning: check rates cron log"

            echo "Verifying HMLR Prices Ingest Cron..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "$PROD_URL/api/cron/intelligence-prices" | grep -q "ok" && echo "Prices cron verified" || echo "Warning: check prices cron log"

            echo "Verifying FCA Lender Sync Cron..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "$PROD_URL/api/cron/lenders-fca" | grep -qE '"ok"|FCA_API' && echo "FCA lenders cron verified" || echo "Warning: check FCA lenders cron log"
          fi
